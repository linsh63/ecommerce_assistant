model:
  base_model: "Qwen/Qwen3-8B"
  adapter_model: null
  trust_remote_code: true
  torch_dtype: "float16"
  load_in_4bit: true
  quantization_method: "bnb"
  quantization_type: "nf4"
  double_quantization: true
  device_map: "ddp"
lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"
training:
  output_dir: "outputs/lora_ablation_jddc_rebuild_v2/rank16_all_linear_qlora"
  max_seq_length: 2048
  learning_rate: 0.0002
  num_train_epochs: 2.0
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  warmup_ratio: 0.1
  lr_scheduler_type: "cosine"
  logging_steps: 10
  save_steps: 200
  eval_steps: 100
  eval_strategy: "steps"
  save_strategy: "steps"
  max_grad_norm: 1.0
  gradient_checkpointing: true
  bf16: false
  fp16: true
  optim: "paged_adamw_8bit"
  ddp_find_unused_parameters: false
  report_to: "none"
  seed: 42
  save_total_limit: 2
  load_best_model_at_end: false
  resume_from_checkpoint: null
  log_sample_count: 3
data:
  train_file: "data/processed/jddc_rebuild_v2/05_final/sft_train.jsonl"
  eval_file: "data/processed/jddc_rebuild_v2/05_final/sft_dev.jsonl"
  hf_dataset_name: null
  hf_dataset_config: null
  hf_split: "train"
  dialogue_column: "dialogue"
  role_field: "role"
  text_field: "text"
  max_samples: null
  max_history_turns: 6
  hf_eval_size: 200
  chat_template: "qwen3_nothink"
  default_system: "你是电商平台客服助手。请先判断用户咨询类型，再给出直接、具体、礼貌、可执行的中文回复。分类只能从以下12类中选择：物流-查件催发、物流-配送调整、售后-退换维修、售后-质量异常、退款-取消价保、商品咨询-参数、商品咨询-使用方法、购买决策-推荐对比、价格活动-优惠赠品、发票-资质服务、投诉-安抚升级、闲聊-礼貌收尾。输出格式必须严格为两行：第一行【分类：<上述类别之一>】，第二行【回复：<客服回复>】。不要空泛套模板，不要输出方括号占位符。"
  train_on_prompt: false
  mask_history: false
  validation_split_ratio: 0.1
  validation_split_size: null
  max_train_samples: null
  max_eval_samples: null
  shuffle_seed: 42
post_train_generation:
  enabled: true
  test_file: "data/processed/jddc_rebuild_v2/05_final/eval_test.jsonl"
  output_jsonl: "post_train_test_generations.jsonl"
  output_markdown: "post_train_test_generations.md"
  max_samples: null
  max_new_tokens: 320
  do_sample: false
  temperature: 0.2
  top_p: 0.9
  repetition_penalty: 1.05
  print_every: 10
