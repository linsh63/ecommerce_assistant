model:
  sft_adapter_path: outputs/sft_lora_qwen3_8b_jddc_rebuild_v2_augmented
  base_model: Qwen/Qwen3-8B
  trust_remote_code: true
  load_in_4bit: true

training:
  output_dir: outputs/ppo_jddc_rebuild_v2
  learning_rate: 0.000005     # 5e-6
  beta: 0.1                    # KL 惩罚系数
  clip_epsilon: 0.2            # PPO clip 范围
  max_steps: 200
  prompts_per_step: 4
  max_new_tokens: 256
  temperature: 0.8
  top_p: 0.9
  max_grad_norm: 1.0
  gradient_accumulation_steps: 2
  bf16: true
  fp16: false
  seed: 42
  logging_steps: 5
  save_steps: 50
  save_total_limit: 2

data:
  prompt_file: data/processed/jddc_rebuild_v2/05_final/sft_train.jsonl
  max_prompts: 500
  shuffle_seed: 42

reward:
  api_base_url: https://api.deepseek.com
  api_key: "${DEEPSEEK_API_KEY}"
  model: deepseek-chat
  temperature: 0.1
  max_tokens: 512
  timeout: 60
  max_retries: 2
